name = "dashboard-radio-worker"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
account_id = "458e6d616cddf6660731e71235fe4c45"

# KV Namespace
kv_namespaces = [
  { binding = "CACHE", id = "598948c19c524ab3af65831cd8f6278f" },
  { binding = "DASHBOARD_KV", id = "598948c19c524ab3af65831cd8f6278f" }
]

# ⏰ SCHEDULED WORKER - Busca inserções a cada 5 minutos
[triggers]
crons = ["*/5 * * * *"]

[build]
command = ""

[build.upload]
format = "service-worker"

# Ambiente de produção
[env.production]
name = "dashboard-radio-worker"

# Para configurar secrets (API keys), use:
# wrangler secret put AUDIENCY_API_KEY
# wrangler secret put GEONAMES_USERNAME



