<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste - Listar Vídeos do Google Drive</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        button {
            padding: 12px 24px;
            margin: 10px 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            background: #222;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
            border-left: 4px solid #00ff00;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 600px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .error {
            border-left-color: #ff0000;
        }
        .success {
            border-left-color: #00ff00;
        }
        h1 {
            color: #00ff00;
            margin-bottom: 10px;
        }
        .info {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .video-item {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 3px solid #00d9ff;
        }
        .video-title {
            color: #00d9ff;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .video-info {
            color: #aaa;
            font-size: 12px;
            margin: 5px 0;
        }
        .video-link {
            color: #90EE90;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
        }
        .video-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Teste - Listar Vídeos do Google Drive</h1>
        <p class="info">Clique no botão para buscar vídeos da pasta configurada</p>
        
        <button onclick="testarVideos()">1. Testar /api/videos</button>
        <button onclick="testarVideosComDebug()">2. Testar com Debug Detalhado</button>
        <button onclick="limpar()">Limpar</button>
        
        <div id="result" class="result">Aguardando teste...</div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        function log(msg) {
            const el = document.getElementById('result');
            el.textContent += msg + '\n';
            el.scrollTop = el.scrollHeight;
        }
        
        function limpar() {
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = 'result';
        }
        
        async function testarVideos() {
            limpar();
            log('🎥 Buscando /api/videos...\n');
            
            try {
                const response = await fetch(`${API_BASE}/api/videos`);
                const data = await response.json();
                
                if (!response.ok) {
                    log(`❌ ERRO HTTP ${response.status}\n`);
                    log(JSON.stringify(data, null, 2));
                    document.getElementById('result').classList.add('error');
                    return;
                }
                
                document.getElementById('result').classList.add('success');
                log(`✅ Status: ${response.status}\n`);
                log(`📊 Vídeos encontrados: ${data.total || 0}\n`);
                
                if (data.videos && data.videos.length > 0) {
                    log(`\n${'═'.repeat(100)}`);
                    log(`📹 LISTA DE VÍDEOS`);
                    log(`${'═'.repeat(100)}\n`);
                    
                    data.videos.forEach((video, idx) => {
                        log(`[${idx + 1}] ${video.nome}`);
                        log(`    ID: ${video.id}`);
                        log(`    Tipo: ${video.tipo}`);
                        log(`    Criado: ${video.criado}`);
                        log(`    Preview: ${video.urlVisualizar}`);
                        log(`    Web View: ${video.webViewLink}`);
                        log(`\n`);
                    });
                    
                    log(`${'═'.repeat(100)}`);
                    log(`\n✅ ${data.total} vídeo(s) carregado(s) com sucesso!\n`);
                } else {
                    log(`⚠️ Nenhum vídeo encontrado na pasta.\n`);
                }
                
                log('\n📋 RESPOSTA COMPLETA:');
                log(JSON.stringify(data, null, 2));
                
            } catch (error) {
                log(`❌ ERRO: ${error.message}`);
                document.getElementById('result').classList.add('error');
            }
        }
        
        async function testarVideosComDebug() {
            limpar();
            log('🔍 Testando /api/videos com DEBUG DETALHADO...\n');
            
            try {
                log('⏳ Enviando requisição...\n');
                const startTime = Date.now();
                
                const response = await fetch(`${API_BASE}/api/videos`);
                const elapsedTime = Date.now() - startTime;
                
                log(`⏱️ Tempo de resposta: ${elapsedTime}ms\n`);
                log(`📊 Status: ${response.status}`);
                log(`📋 Content-Type: ${response.headers.get('content-type')}\n`);
                
                const data = await response.json();
                
                if (!response.ok) {
                    log(`❌ ERRO HTTP ${response.status}\n`);
                    log(`Erro: ${data.erro}`);
                    log(`\nDetalhes:\n${data.detalhes}`);
                    
                    if (data.instrucoes) {
                        log(`\n📚 INSTRUÇÕES DE CONFIGURAÇÃO:`);
                        Object.entries(data.instrucoes).forEach(([step, instruction]) => {
                            log(`${step}: ${instruction}`);
                        });
                    }
                    
                    document.getElementById('result').classList.add('error');
                    return;
                }
                
                document.getElementById('result').classList.add('success');
                
                log(`✅ Resposta bem-sucedida!\n`);
                log(`\n📊 ESTATÍSTICAS:`);
                log(`   Total de vídeos: ${data.total}`);
                log(`   Sucesso: ${data.sucesso}`);
                
                if (data.videos && data.videos.length > 0) {
                    log(`\n🎬 VÍDEOS ENCONTRADOS:\n`);
                    
                    data.videos.forEach((video, idx) => {
                        log(`\n${idx + 1}. ${video.nome}`);
                        log(`   ├─ ID: ${video.id}`);
                        log(`   ├─ Tipo MIME: ${video.tipo}`);
                        log(`   ├─ Criado em: ${video.criado}`);
                        log(`   ├─ URL Preview: ${video.urlVisualizar}`);
                        log(`   ├─ URL Download: ${video.urlDownload}`);
                        log(`   ├─ URL Embed: ${video.urlEmbed}`);
                        log(`   └─ Web View: ${video.webViewLink}`);
                    });
                    
                    log(`\n\n✅ Total: ${data.total} vídeo(s) listado(s) com sucesso!`);
                } else {
                    log(`\n⚠️ Nenhum vídeo encontrado na pasta.\n`);
                    log(`Possíveis motivos:`);
                    log(`  1. A pasta está vazia`);
                    log(`  2. A API Key não tem acesso à pasta`);
                    log(`  3. Não há vídeos (MP4, WebM, MOV) na pasta`);
                }
                
                log(`\n\n📋 RESPOSTA COMPLETA JSON:`);
                log(JSON.stringify(data, null, 2));
                
            } catch (error) {
                log(`❌ ERRO: ${error.message}`);
                log(`\n${error.stack}`);
                document.getElementById('result').classList.add('error');
            }
        }
    </script>
</body>
</html>
