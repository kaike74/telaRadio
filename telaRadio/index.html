<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#001B4D">
    <title>Dashboard de Monitoramento - Rádio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Coluna Esquerda (60%) -->
        <div class="left-column">
            <!-- Maapa do Brasil (60% altura) -->
            <div class="mapa-section">
                <div class="mapa-content-wrapper">
                    <!-- Mapa (75% da largura) -->
                    <div id="mapa-container">
                        <img id="mapa-brasil" src="mapa-brasil.svg" alt="Mapa do Brasil" />
                        <!-- Container de animações -->
                        <div id="animacoes-layer"></div>
                    </div>

                    <!-- Lista de Inserções (25% da largura) -->
                    <div class="insercoes-lateral">
                        <h4>Últimas Inserções</h4>
                        <div id="lista-insercoes-lateral" class="lista-lateral">
                            <div class="loading">Carregando...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Coluna Direita (40%) -->
        <div class="right-column">
            <!-- Métricas (3 blocos) -->
            <div class="metricas-section">
                <div class="metrica-card">
                    <div class="metrica-valor" id="metrica-campanhas">--</div>
                    <div class="metrica-label">Campanhas Ativas</div>
                </div>
                <div class="metrica-card">
                    <div class="metrica-valor" id="metrica-radios">--</div>
                    <div class="metrica-label">Rádios Ativas</div>
                </div>
                <div class="metrica-card">
                    <div class="metrica-valor" id="metrica-insercoes">--</div>
                    <div class="metrica-label">Inserções Hoje</div>
                </div>
            </div>

            <!-- Gráfico: Top Emissoras -->
            <div class="grafico-section">
                <h3>Emissoras com Maior Número de Campanhas Ativas</h3>
                <div id="grafico-emissoras" class="grafico-container">
                    <div class="loading">Carregando...</div>
                </div>
            </div>

            <!-- Gráfico: Top 3 Cidades em Grade -->
            <div class="grafico-section">
                <h3>Cidades com Maior Número de Emissoras Ativas</h3>
                <div id="grafico-cidades" class="grafico-cidades-grade">
                    <div class="loading">Carregando...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip flutuante -->
    <div id="tooltip" class="tooltip hidden">
        <div class="tooltip-content"></div>
    </div>

    <!-- News Ticker / Rodapé de Notícias -->
    <div id="news-ticker" class="news-ticker">
        <div class="ticker-header">
            <span class="ticker-label">Hoje no Radar</span>
        </div>
        <div class="ticker-content">
            <div class="ticker-scroll">
                <div id="ticker-items" class="ticker-items">
                    <!-- Items populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
