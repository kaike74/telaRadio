<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Dashboard</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .result {
            background: #222;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
            border-left: 4px solid #00ff00;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 500px;
            overflow-y: auto;
        }
        .error {
            border-left-color: #ff0000;
        }
        h2 {
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Teste do Dashboard</h1>
        <p>Clique para testar os endpoints</p>
        
        <button onclick="testarDashboard()">1. Testar /api/dashboard</button>
        <button onclick="testarInsercoes()">2. Testar /api/insercoes/recentes</button>
        <button onclick="testarCidades()">3. Testar apenas CIDADES</button>
        <button onclick="limpar()">Limpar</button>
        
        <div id="result" class="result">Aguardando teste...</div>
    </div>

    <script>
        const API_BASE = window.location.origin; // Usa a mesma origin
        
        function log(msg) {
            const el = document.getElementById('result');
            el.textContent += msg + '\n';
            el.scrollTop = el.scrollHeight;
        }
        
        function limpar() {
            document.getElementById('result').textContent = '';
        }
        
        async function testarDashboard() {
            limpar();
            log('🔍 Buscando /api/dashboard...\n');
            
            try {
                const response = await fetch(`${API_BASE}/api/dashboard`);
                const data = await response.json();
                
                if (!response.ok) {
                    log(`❌ ERRO HTTP ${response.status}\n`);
                    log(JSON.stringify(data, null, 2));
                    document.getElementById('result').classList.add('error');
                    return;
                }
                
                log(`✅ Status: ${response.status}\n`);
                log(`📊 Campanhas ativas: ${data.metricas?.campanhasAtivas || 'N/A'}`);
                log(`📻 Rádios ativas: ${data.metricas?.emissorasAtivas || 'N/A'}`);
                log(`📍 Cidades ativas: ${data.metricas?.cidadesAtivas || 'N/A'}\n`);
                
                // Testar Top 3 Cidades
                if (data.metricas?.top3CidadesComEmissoras) {
                    log(`\n✨ TOP 3 CIDADES COM EMISSORAS:`);
                    log(`Total de cidades retornadas: ${data.metricas.top3CidadesComEmissoras.length}\n`);
                    
                    data.metricas.top3CidadesComEmissoras.forEach((cidade, idx) => {
                        log(`\n[${idx+1}] ${cidade.chaveCompleta}`);
                        log(`    Emissoras: ${cidade.numerosEmissorasAtivas}`);
                        log(`    Lista: ${cidade.emissoras?.slice(0, 5).join(', ') || 'Vazia'}${cidade.emissoras?.length > 5 ? '...' : ''}`);
                    });
                } else {
                    log('\n⚠️ top3CidadesComEmissoras não encontrado!');
                }
                
                log('\n\n📋 RESPOSTA COMPLETA:');
                log(JSON.stringify(data, null, 2));
                
            } catch (error) {
                log(`❌ ERRO: ${error.message}`);
                document.getElementById('result').classList.add('error');
            }
        }
        
        async function testarInsercoes() {
            limpar();
            log('🔍 Buscando /api/insercoes/recentes...\n');
            
            try {
                const response = await fetch(`${API_BASE}/api/insercoes/recentes`);
                const data = await response.json();
                
                if (!response.ok) {
                    log(`❌ ERRO HTTP ${response.status}\n`);
                    log(JSON.stringify(data, null, 2));
                    document.getElementById('result').classList.add('error');
                    return;
                }
                
                log(`✅ Status: ${response.status}`);
                log(`📊 Inserções recentes: ${data.insercoesRecentes?.length || 0}`);
                log(`📍 Coordenadas: ${data.coordenadas?.length || 0}\n`);
                
                log(JSON.stringify(data, null, 2));
                
            } catch (error) {
                log(`❌ ERRO: ${error.message}`);
                document.getElementById('result').classList.add('error');
            }
        }
        
        async function testarCidades() {
            limpar();
            log('🔍 Testando apenas a ESTRUTURA DE CIDADES...\n');
            
            try {
                const response = await fetch(`${API_BASE}/api/dashboard`);
                const data = await response.json();
                
                if (!response.ok) {
                    log(`❌ ERRO HTTP ${response.status}`);
                    log(JSON.stringify(data, null, 2));
                    document.getElementById('result').classList.add('error');
                    return;
                }
                
                const cidades = data.metricas?.top3CidadesComEmissoras || [];
                log(`✅ Cidades recebidas: ${cidades.length}\n`);
                
                if (cidades.length === 0) {
                    log('⚠️ Nenhuma cidade retornada!');
                    return;
                }
                
                cidades.forEach((cidade, idx) => {
                    log(`\n[CIDADE ${idx+1}]`);
                    log(`  chaveCompleta: ${cidade.chaveCompleta}`);
                    log(`  numerosEmissorasAtivas: ${cidade.numerosEmissorasAtivas}`);
                    log(`  emissoras.length: ${cidade.emissoras?.length || 0}`);
                    log(`  emissoras (primeiras 5):`);
                    cidade.emissoras?.slice(0, 5).forEach((e, i) => {
                        log(`    ${i+1}. ${e}`);
                    });
                });
                
            } catch (error) {
                log(`❌ ERRO: ${error.message}`);
                log(`\nStack: ${error.stack}`);
                document.getElementById('result').classList.add('error');
            }
        }
    </script>
</body>
</html>
