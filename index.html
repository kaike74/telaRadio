<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Monitoramento - Rádio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Coluna Esquerda (60%) -->
        <div class="left-column">
            <!-- Mapa do Brasil (60% altura) -->
            <div class="mapa-section">
                <h2>Inserções em Tempo Real</h2>
                <div id="mapa-container">
                    <svg id="mapa-brasil" viewBox="0 0 1000 1000">
                        <!-- SVG do mapa será carregado aqui -->
                        <text x="500" y="500" text-anchor="middle" fill="#666" font-size="20">
                            Mapa do Brasil será carregado aqui
                        </text>
                    </svg>
                    <!-- Container de animações -->
                    <div id="animacoes-layer"></div>
                </div>
                <div class="legenda">
                    <span class="legenda-item">
                        <span class="pinga-demo"></span>
                        Inserção em execução (últimos 30s)
                    </span>
                </div>
            </div>

            <!-- Lista de Inserções (40% altura) -->
            <div class="insercoes-section">
                <h3>Últimas Inserções</h3>
                <div id="lista-insercoes" class="lista-scroll">
                    <div class="loading">Carregando inserções...</div>
                </div>
            </div>
        </div>

        <!-- Coluna Direita (40%) -->
        <div class="right-column">
            <!-- Métricas (3 blocos) -->
            <div class="metricas-section">
                <div class="metrica-card">
                    <div class="metrica-valor" id="metrica-campanhas">--</div>
                    <div class="metrica-label">Campanhas Ativas</div>
                </div>
                <div class="metrica-card">
                    <div class="metrica-valor" id="metrica-radios">--</div>
                    <div class="metrica-label">Rádios Ativas</div>
                </div>
                <div class="metrica-card">
                    <div class="metrica-valor" id="metrica-insercoes">--</div>
                    <div class="metrica-label">Inserções Hoje</div>
                </div>
            </div>

            <!-- Gráfico: Top Emissoras -->
            <div class="grafico-section">
                <h3>Top Emissoras por Campanhas</h3>
                <div id="grafico-emissoras" class="grafico-container">
                    <div class="loading">Carregando...</div>
                </div>
            </div>

            <!-- Gráfico: Top Cidades -->
            <div class="grafico-section">
                <h3>Top Cidades por Emissoras</h3>
                <div id="grafico-cidades" class="grafico-container">
                    <div class="loading">Carregando...</div>
                </div>
            </div>

            <!-- Última Atualização -->
            <div class="footer-info">
                <span id="ultima-atualizacao">Última atualização: --</span>
            </div>
        </div>
    </div>

    <!-- Tooltip flutuante -->
    <div id="tooltip" class="tooltip hidden">
        <div class="tooltip-content"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
